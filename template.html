<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Fork Repos Update Monitor</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --icon-size: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
    max-width: 960px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  h1 svg { width: 24px; height: 24px; }
  .subtitle { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.5rem; }

  /* Stats bar */
  .stats {
    display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    flex: 1;
    min-width: 120px;
    text-align: center;
  }
  .stat-card .num { font-size: 1.75rem; font-weight: 700; }
  .stat-card .label {
    font-size: 0.75rem; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: flex; align-items: center; justify-content: center; gap: 0.3rem;
  }
  .stat-card .label svg { width: 13px; height: 13px; }
  .stat-card.up-to-date .num { color: var(--green); }
  .stat-card.behind .num { color: var(--yellow); }
  .stat-card.ahead .num { color: var(--accent); }
  .stat-card.diverged .num { color: var(--red); }
  .stat-card.total .num { color: var(--purple); }

  /* Filter */
  .filter-bar {
    display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.35rem 0.9rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .filter-btn svg { width: 14px; height: 14px; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 1.5rem;
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    pointer-events: none;
    display: flex;
  }
  .search-wrap .search-icon svg { width: 16px; height: 16px; }
  .search-wrap .clear-btn {
    position: absolute;
    right: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: none;
    align-items: center;
    padding: 0.2rem;
    border-radius: 4px;
  }
  .search-wrap .clear-btn svg { width: 16px; height: 16px; }
  .search-wrap .clear-btn:hover { color: var(--text); background: var(--border); }
  .search-wrap.has-text .clear-btn { display: flex; }
  .search-box {
    width: 100%;
    padding: 0.6rem 1rem 0.6rem 2.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-secondary); }

  /* Repo card */
  .repo-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }
  .repo-card:hover { border-color: var(--accent); }
  .repo-card.status-behind { border-left: 3px solid var(--yellow); }
  .repo-card.status-diverged { border-left: 3px solid var(--red); }
  .repo-card.status-ahead { border-left: 3px solid var(--accent); }
  .repo-card.status-up_to_date { border-left: 3px solid var(--green); }
  .repo-card.status-unknown { border-left: 3px solid var(--text-secondary); }

  .repo-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    margin-bottom: 0.5rem;
  }
  .repo-name {
    font-size: 1rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .repo-name a { color: var(--accent); text-decoration: none; }
  .repo-name a:hover { text-decoration: underline; }
  .repo-name .arrow-icon {
    color: var(--yellow);
    display: inline-flex;
  }
  .repo-name .arrow-icon svg { width: 14px; height: 14px; }

  .status-badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }
  .status-badge svg { width: 12px; height: 12px; }
  .status-badge.up_to_date { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-badge.behind { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .status-badge.ahead { background: rgba(88,166,255,0.15); color: var(--accent); }
  .status-badge.diverged { background: rgba(248,81,73,0.15); color: var(--red); }
  .status-badge.unknown { background: rgba(139,148,158,0.15); color: var(--text-secondary); }

  .repo-desc {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 0.75rem;
  }
  .repo-meta {
    display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-secondary);
  }
  .repo-meta span {
    display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .repo-meta span svg { width: 14px; height: 14px; }

  .commits-info {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .commits-info .behind-count { color: var(--yellow); font-weight: 600; }
  .commits-info .ahead-count { color: var(--accent); font-weight: 600; }

  .sync-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.5rem;
    padding: 0.3rem 0.75rem;
    font-size: 0.75rem;
    background: rgba(88,166,255,0.1);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    transition: background 0.2s;
  }
  .sync-btn svg { width: 14px; height: 14px; }
  .sync-btn:hover { background: rgba(88,166,255,0.25); }

  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-secondary);
    position: relative;
  }
  .back-to-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 1000;
  }
  .back-to-top svg { width: 18px; height: 18px; }
  .back-to-top.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .back-to-top:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
  }

  @media (max-width: 600px) {
    body { padding: 1rem 0.75rem; }
    .stat-card { min-width: 90px; padding: 0.5rem 0.75rem; }
    .stat-card .num { font-size: 1.25rem; }
    .repo-header { flex-direction: column; }
  }
</style>
</head>
<body>

<h1><i data-lucide="git-fork"></i> Fork Update Monitor</h1>
<p class="subtitle" id="subtitle">Loading...</p>

<div class="stats" id="stats"></div>

<div class="search-wrap" id="searchWrap">
  <span class="search-icon"><i data-lucide="search"></i></span>
  <input type="text" class="search-box" id="search" placeholder="Search repos..." />
  <button class="clear-btn" id="clearSearch" title="Clear" aria-label="Clear search"><i data-lucide="x"></i></button>
</div>

<div class="filter-bar" id="filters"></div>

<div id="repos"></div>

<button class="back-to-top" id="backToTop" title="Back to top" aria-label="Back to top">
  <i data-lucide="arrow-up"></i>
</button>

<footer>
  Powered by GitHub Actions &amp; Pages ·
  <span id="gen-time"></span>
</footer>

<script>
const DATA = {{DATA_PLACEHOLDER}};

const STATUS_ICONS = {
  up_to_date: "check-circle-2",
  behind: "arrow-down-circle",
  ahead: "arrow-up-circle",
  diverged: "git-compare-arrows",
  unknown: "help-circle"
};

const STATUS_LABELS = {
  up_to_date: "Up to date",
  behind: "Behind",
  ahead: "Ahead",
  diverged: "Diverged",
  unknown: "Unknown"
};

const STATUS_ORDER = { behind: 0, diverged: 1, unknown: 2, ahead: 3, up_to_date: 4 };

let currentFilter = "all";

function icon(name) {
  return '<i data-lucide="' + name + '"></i>';
}

function refreshIcons() {
  if (window.lucide) lucide.createIcons();
}

function init() {
  const d = DATA;
  document.getElementById("subtitle").textContent =
    "Monitoring " + d.username + "'s forked repositories — " + d.total_forks + " repos tracked";

  // Stats
  const statsEl = document.getElementById("stats");
  const stats = [
    { key: "total", label: "Total", val: d.total_forks, icon: "git-fork" },
    { key: "behind", label: "Behind", val: d.status_counts.behind || 0, icon: "arrow-down" },
    { key: "diverged", label: "Diverged", val: d.status_counts.diverged || 0, icon: "git-compare-arrows" },
    { key: "up-to-date", label: "Up to date", val: d.status_counts.up_to_date || 0, icon: "check" },
    { key: "ahead", label: "Ahead", val: d.status_counts.ahead || 0, icon: "arrow-up" },
  ];
  statsEl.innerHTML = stats.map(function(s) {
    return '<div class="stat-card ' + s.key + '">' +
      '<div class="num">' + s.val + '</div>' +
      '<div class="label">' + icon(s.icon) + ' ' + s.label + '</div>' +
      '</div>';
  }).join("");

  // Filters
  const filtersEl = document.getElementById("filters");
  const filterOptions = [
    { key: "all", label: "All", icon: "list" },
    { key: "behind", label: "Behind", icon: "arrow-down" },
    { key: "diverged", label: "Diverged", icon: "git-compare-arrows" },
    { key: "up_to_date", label: "Up to date", icon: "check" },
    { key: "ahead", label: "Ahead", icon: "arrow-up" },
  ];
  filtersEl.innerHTML = filterOptions.map(function(f) {
    return '<button class="filter-btn' + (f.key === "all" ? " active" : "") + '" data-filter="' + f.key + '">' +
      icon(f.icon) + ' ' + f.label + '</button>';
  }).join("");
  filtersEl.addEventListener("click", function(e) {
    if (!e.target.classList.contains("filter-btn")) return;
    filtersEl.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    renderRepos();
  });

  // Search
  const searchInput = document.getElementById("search");
  const searchWrap = document.getElementById("searchWrap");
  const clearBtn = document.getElementById("clearSearch");
  searchInput.addEventListener("input", function() {
    searchWrap.classList.toggle("has-text", searchInput.value.length > 0);
    renderRepos();
  });
  clearBtn.addEventListener("click", function() {
    searchInput.value = "";
    searchWrap.classList.remove("has-text");
    searchInput.focus();
    renderRepos();
  });

  // Time
  const genTime = new Date(d.generated_at);
  document.getElementById("gen-time").textContent =
    "Last updated: " + genTime.toLocaleString() + " (UTC)";

  renderRepos();
}

function renderRepos() {
  const query = document.getElementById("search").value.toLowerCase();
  let repos = DATA.repos.slice();

  if (currentFilter !== "all") {
    repos = repos.filter(function(r) { return r.status === currentFilter; });
  }

  if (query) {
    repos = repos.filter(function(r) {
      return r.fork_repo.toLowerCase().includes(query) ||
        r.parent_repo.toLowerCase().includes(query) ||
        (r.fork_description || "").toLowerCase().includes(query);
    });
  }

  repos.sort(function(a, b) {
    return (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
  });

  const container = document.getElementById("repos");
  if (repos.length === 0) {
    container.innerHTML = '<div class="empty-state">No repositories match the current filter.</div>';
    refreshIcons();
    return;
  }

  container.innerHTML = repos.map(function(r) {
    const shortFork = r.fork_repo.split("/")[1];
    const shortParent = r.parent_repo.split("/")[1];
    const desc = r.fork_description || r.parent_description || "";
    const syncUrl = "https://github.com/" + r.fork_repo;
    const forkUpdated = r.fork_pushed_at ? formatDate(r.fork_pushed_at) : "N/A";
    const parentUpdated = r.parent_pushed_at ? formatDate(r.parent_pushed_at) : "N/A";

    let commitsHtml = "";
    if (r.behind_by > 0 || r.ahead_by > 0) {
      commitsHtml = '<div class="commits-info">';
      if (r.behind_by > 0) commitsHtml += '<span class="behind-count">' + r.behind_by + '</span> commit(s) behind upstream';
      if (r.behind_by > 0 && r.ahead_by > 0) commitsHtml += " · ";
      if (r.ahead_by > 0) commitsHtml += '<span class="ahead-count">' + r.ahead_by + '</span> commit(s) ahead';
      commitsHtml += '</div>';
    }

    let syncBtn = "";
    if (r.status === "behind" || r.status === "diverged") {
      syncBtn = '<a class="sync-btn" href="' + syncUrl + '" target="_blank" rel="noopener">' +
        icon("refresh-cw") + ' Sync fork</a>';
    }

    const statusIconName = STATUS_ICONS[r.status] || "help-circle";
    const statusLabel = STATUS_LABELS[r.status] || r.status;

    return '<div class="repo-card status-' + r.status + '">' +
      '<div class="repo-header">' +
        '<div class="repo-name">' +
          '<a href="' + r.fork_url + '" target="_blank" rel="noopener">' + shortFork + '</a>' +
          '<span class="arrow-icon">' + icon("arrow-left") + '</span>' +
          '<a href="' + r.parent_url + '" target="_blank" rel="noopener" style="color:var(--text-secondary)">' + shortParent + '</a>' +
        '</div>' +
        '<span class="status-badge ' + r.status + '">' + icon(statusIconName) + ' ' + statusLabel + '</span>' +
      '</div>' +
      (desc ? '<div class="repo-desc">' + escHtml(desc) + '</div>' : '') +
      '<div class="repo-meta">' +
        '<span>' + icon("git-fork") + ' Fork: ' + forkUpdated + '</span>' +
        '<span>' + icon("home") + ' Upstream: ' + parentUpdated + '</span>' +
        (r.parent_stars ? '<span>' + icon("star") + ' ' + r.parent_stars + '</span>' : '') +
      '</div>' +
      commitsHtml +
      syncBtn +
    '</div>';
  }).join("");

  refreshIcons();
}

function formatDate(isoStr) {
  try {
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffDays = Math.floor(diffMs / 86400000);
    if (diffDays === 0) return "today";
    if (diffDays === 1) return "yesterday";
    if (diffDays < 30) return diffDays + "d ago";
    if (diffDays < 365) return Math.floor(diffDays / 30) + "mo ago";
    return Math.floor(diffDays / 365) + "y ago";
  } catch {
    return isoStr;
  }
}

function escHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// Back to top
(function() {
  const btn = document.getElementById("backToTop");
  window.addEventListener("scroll", function() {
    btn.classList.toggle("visible", window.scrollY > 400);
  });
  btn.addEventListener("click", function() {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();

init();
refreshIcons();
</script>
</body>
</html>
