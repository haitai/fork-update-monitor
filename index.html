<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
    max-width: 960px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.5rem; }

  /* Stats bar */
  .stats {
    display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    flex: 1;
    min-width: 120px;
    text-align: center;
  }
  .stat-card .num { font-size: 1.75rem; font-weight: 700; }
  .stat-card .label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card.up-to-date .num { color: var(--green); }
  .stat-card.behind .num { color: var(--yellow); }
  .stat-card.ahead .num { color: var(--accent); }
  .stat-card.diverged .num { color: var(--red); }
  .stat-card.total .num { color: var(--purple); }

  /* Filter */
  .filter-bar {
    display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.35rem 0.9rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Search */
  .search-box {
    width: 100%;
    padding: 0.6rem 1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-secondary); }

  /* Repo card */
  .repo-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }
  .repo-card:hover { border-color: var(--accent); }
  .repo-card.status-behind { border-left: 3px solid var(--yellow); }
  .repo-card.status-diverged { border-left: 3px solid var(--red); }
  .repo-card.status-ahead { border-left: 3px solid var(--accent); }
  .repo-card.status-up_to_date { border-left: 3px solid var(--green); }
  .repo-card.status-unknown { border-left: 3px solid var(--text-secondary); }

  .repo-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    margin-bottom: 0.5rem;
  }
  .repo-name {
    font-size: 1rem; font-weight: 600;
  }
  .repo-name a { color: var(--accent); text-decoration: none; }
  .repo-name a:hover { text-decoration: underline; }

  .status-badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .status-badge.up_to_date { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-badge.behind { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .status-badge.ahead { background: rgba(88,166,255,0.15); color: var(--accent); }
  .status-badge.diverged { background: rgba(248,81,73,0.15); color: var(--red); }
  .status-badge.unknown { background: rgba(139,148,158,0.15); color: var(--text-secondary); }

  .repo-desc {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 0.75rem;
  }
  .repo-meta {
    display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-secondary);
  }
  .repo-meta span { display: flex; align-items: center; gap: 0.3rem; }
  .arrow { color: var(--yellow); font-weight: bold; margin: 0 0.15rem; }

  .commits-info {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .commits-info .behind-count { color: var(--yellow); font-weight: 600; }
  .commits-info .ahead-count { color: var(--accent); font-weight: 600; }

  .sync-btn {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.3rem 0.75rem;
    font-size: 0.75rem;
    background: rgba(88,166,255,0.1);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    transition: background 0.2s;
  }
  .sync-btn:hover { background: rgba(88,166,255,0.25); }

  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-secondary);
    position: relative;
  }
  .back-to-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 1000;
  }
  .back-to-top.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .back-to-top:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
  }

  @media (max-width: 600px) {
    body { padding: 1rem 0.75rem; }
    .stat-card { min-width: 90px; padding: 0.5rem 0.75rem; }
    .stat-card .num { font-size: 1.25rem; }
    .repo-header { flex-direction: column; }
  }
</style>
</head>

const STATUS_LABELS = {
  up_to_date: "✅ Up to date",
  behind: "⬇️ Behind",
  ahead: "⬆️ Ahead",
  diverged: "↔️ Diverged",
  unknown: "❓ Unknown"
};

const STATUS_ORDER = { behind: 0, diverged: 1, unknown: 2, ahead: 3, up_to_date: 4 };

let currentFilter = "all";

function init() {
  const d = DATA;
  document.getElementById("subtitle").textContent =
    `Monitoring ${d.username}'s forked repositories — ${d.total_forks} repos tracked`;

  // Stats
  const statsEl = document.getElementById("stats");
  const stats = [
    { key: "total", label: "Total", val: d.total_forks },
    { key: "behind", label: "Behind", val: d.status_counts.behind || 0 },
    { key: "diverged", label: "Diverged", val: d.status_counts.diverged || 0 },
    { key: "up-to-date", label: "Up to date", val: d.status_counts.up_to_date || 0 },
    { key: "ahead", label: "Ahead", val: d.status_counts.ahead || 0 },
  ];
  statsEl.innerHTML = stats.map(s =>
    `<div class="stat-card ${s.key}"><div class="num">${s.val}</div><div class="label">${s.label}</div></div>`
  ).join("");

  // Filters
  const filtersEl = document.getElementById("filters");
  const filterOptions = [
    { key: "all", label: "All" },
    { key: "behind", label: "⬇️ Behind" },
    { key: "diverged", label: "↔️ Diverged" },
    { key: "up_to_date", label: "✅ Up to date" },
    { key: "ahead", label: "⬆️ Ahead" },
  ];
  filtersEl.innerHTML = filterOptions.map(f =>
    `<button class="filter-btn${f.key === "all" ? " active" : ""}" data-filter="${f.key}">${f.label}</button>`
  ).join("");
  filtersEl.addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    renderRepos();
  });

  // Search
  document.getElementById("search").addEventListener("input", renderRepos);

  // Time
  const genTime = new Date(d.generated_at);
  document.getElementById("gen-time").textContent =
    `Last updated: ${genTime.toLocaleString()} (UTC)`;

  renderRepos();
}

function renderRepos() {
  const query = document.getElementById("search").value.toLowerCase();
  let repos = DATA.repos.slice();

  // Filter
  if (currentFilter !== "all") {
    repos = repos.filter(r => r.status === currentFilter);
  }

  // Search
  if (query) {
    repos = repos.filter(r =>
      r.fork_repo.toLowerCase().includes(query) ||
      r.parent_repo.toLowerCase().includes(query) ||
      (r.fork_description || "").toLowerCase().includes(query)
    );
  }

  // Sort: behind first, then diverged, unknown, ahead, up_to_date
  repos.sort((a, b) => (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9));

  const container = document.getElementById("repos");
  if (repos.length === 0) {
    container.innerHTML = '<div class="empty-state">No repositories match the current filter.</div>';
    return;
  }

  container.innerHTML = repos.map(r => {
    const shortFork = r.fork_repo.split("/")[1];
    const shortParent = r.parent_repo.split("/")[1];
    const desc = r.fork_description || r.parent_description || "";
    const syncUrl = `https://github.com/${r.fork_repo}`;
    const forkUpdated = r.fork_pushed_at ? formatDate(r.fork_pushed_at) : "N/A";
    const parentUpdated = r.parent_pushed_at ? formatDate(r.parent_pushed_at) : "N/A";

    let commitsHtml = "";
    if (r.behind_by > 0 || r.ahead_by > 0) {
      commitsHtml = `<div class="commits-info">`;
      if (r.behind_by > 0) commitsHtml += `<span class="behind-count">${r.behind_by}</span> commit(s) behind upstream`;
      if (r.behind_by > 0 && r.ahead_by > 0) commitsHtml += " · ";
      if (r.ahead_by > 0) commitsHtml += `<span class="ahead-count">${r.ahead_by}</span> commit(s) ahead`;
      commitsHtml += `</div>`;
    }

    let syncBtn = "";
    if (r.status === "behind" || r.status === "diverged") {
      syncBtn = `<a class="sync-btn" href="${syncUrl}" target="_blank" rel="noopener">🔄 Sync fork</a>`;
    }

    return `
      <div class="repo-card status-${r.status}">
        <div class="repo-header">
          <div class="repo-name">
            <a href="${r.fork_url}" target="_blank" rel="noopener">${shortFork}</a>
            <span class="arrow">←</span>
            <a href="${r.parent_url}" target="_blank" rel="noopener" style="color:var(--text-secondary)">${shortParent}</a>
          </div>
          <span class="status-badge ${r.status}">${STATUS_LABELS[r.status] || r.status}</span>
        </div>
        ${desc ? `<div class="repo-desc">${escHtml(desc)}</div>` : ""}
        <div class="repo-meta">
          <span>🍴 Fork: ${forkUpdated}</span>
          <span>🏠 Upstream: ${parentUpdated}</span>
          ${r.parent_stars ? `<span>⭐ ${r.parent_stars}</span>` : ""}
        </div>
        ${commitsHtml}
        ${syncBtn}
      </div>
    `;
  }).join("");
}

function formatDate(isoStr) {
  try {
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffDays = Math.floor(diffMs / 86400000);
    if (diffDays === 0) return "today";
    if (diffDays === 1) return "yesterday";
    if (diffDays < 30) return `${diffDays}d ago`;
    if (diffDays < 365) return `${Math.floor(diffDays / 30)}mo ago`;
    return `${Math.floor(diffDays / 365)}y ago`;
  } catch {
    return isoStr;
  }
}

function escHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}


// Back to top
(function() {
  const btn = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    btn.classList.toggle("visible", window.scrollY > 400);
  });
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();

init();
</script>
