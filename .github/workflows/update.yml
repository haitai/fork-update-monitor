name: Update Fork Monitor

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug - Check token
        run: |
          echo "=== Token Debug ==="
          echo "PERSONAL_ACCESS_TOKEN set: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}"
          echo "GITHUB_TOKEN set: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "Env GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
          echo "Env GITHUB_TOKEN prefix: ${GITHUB_TOKEN:0:4}..."
          echo "Env GITHUB_TOKEN suffix: ...${GITHUB_TOKEN: -4}"
          # 测试 API
          echo "=== Test /user/repos ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/repos?type=forks&per_page=3" | head -c 500
          echo ""
          echo "=== Test /users/haitai/repos ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/haitai/repos?type=forks&per_page=3" | head -c 500
          echo ""
          echo "=== Rate Limit ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/rate_limit" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Core: {d[\"resources\"][\"core\"][\"remaining\"]}/{d[\"resources\"][\"core\"][\"limit\"]}')"
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python monitor.py 2>&1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json -f
          git diff --staged --quiet || git commit -m "🔄 Update fork monitor data - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
