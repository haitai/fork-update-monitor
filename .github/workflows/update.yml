name: Update Fork Monitor

on:
  schedule:
    # 每6小时运行一次 (UTC 0,6,12,18)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          # 需要 Classic PAT (public_repo scope) 或 Fine-grained PAT (Account: Repositories Read + Repository: Contents Read)
          # 如果没有设置 PERSONAL_ACCESS_TOKEN，会回退到 GITHUB_TOKEN（可能无法列出所有 fork）
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "=== Environment ==="
          echo "Username: $GITHUB_USERNAME"
          echo "Token set: $([ -n \"$GITHUB_TOKEN\" ] && echo 'yes' || echo 'no')"
          echo "Token prefix: ${GITHUB_TOKEN:0:8}..."
          python monitor.py 2>&1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json -f
          git diff --staged --quiet || git commit -m "🔄 Update fork monitor data - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
